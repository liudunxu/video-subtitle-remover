name: Build Vast GPU API Image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Docker Hub image name, including namespace
        required: false
        default: ""
      tag:
        description: Image tag to publish
        required: true
        default: vast-gpu

jobs:
  build-vast-gpu:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          if [ -n "${{ inputs.image_name }}" ]; then
            echo "name=${{ inputs.image_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ secrets.DOCKERHUB_USERNAME }}/video-subtitle-remover" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        run: |
          timeout 180s sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          timeout 180s sudo rm -rf /opt/hostedtoolcache || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=${{ inputs.tag }}-

      - name: Build and push Vast GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
